services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-barbearia}
      MYSQL_USER: ${MYSQL_USER:-barbearia}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-barbearia_dev}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-barbearia}", "-p${MYSQL_PASSWORD:-barbearia_dev}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - barbearia_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_PORT: 3333
      API_HOST: 0.0.0.0
      DATABASE_URL: mysql://${MYSQL_USER:-barbearia}:${MYSQL_PASSWORD:-barbearia_dev}@mysql:3306/${MYSQL_DATABASE:-barbearia}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-only-change-this-secret-before-deploying-1234567890}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrador Barbearia}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@barbearia.com}
      SEED_ADMIN_CPF: ${SEED_ADMIN_CPF:-52998224725}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-SenhaForte@2026}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - barbearia_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - api
    networks:
      - barbearia_network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - barbearia_network

volumes:
  mysql_data:

networks:
  barbearia_network:
    driver: bridge
